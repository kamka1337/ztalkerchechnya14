- type: entity
  parent: BaseItem
  id: BaseSessionLimbSyringe
  abstract: true
  name: лечебный шприц
  description: Одноразовый. Вводит 15 ед. препарата в выбранную на кукле конечность.
  components:
  - type: Sprite
    sprite: _Session/Objects/Medical/syringe.rsi
    layers:
    - state: icon
      map: ["base"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SyringeVisuals.Spent:
        base:
          True: { state: used }
          False: { state: icon }
  - type: Item
    size: Tiny
  - type: SolutionContainerManager
    solutions:
      injector:
        maxVol: 15
  - type: ExaminableSolution
    solution: injector
    exactVolume: true
  - type: LimbSyringe
    delay: 2

- type: entity
  parent: BaseSessionLimbSyringe
  id: SessionSyringeKetorolac
  name: шприц кеторолака
  description: 15 мг кеторолака для местного введения. НПВС с выраженным анальгезирующим действием. Восстанавливает повреждения механического, термического и холодового происхождения по 3 ед. в секунду до 35 HP конечности. Только в/м или внутрь поражённой ткани, не в/в.
  components:
  - type: SolutionContainerManager
    solutions:
      injector:
        maxVol: 15
        reagents:
        - ReagentId: Ketorolac
          Quantity: 15

- type: entity
  parent: BaseSessionLimbSyringe
  id: SessionSyringeTranexam
  name: шприц транексама
  description: 15 мг транексама. Быстродействующий гемостатик и регенератор мягких тканей. Восстанавливает урон механического, термического и холодового происхождения по 7 ед. в секунду до 50 HP конечности. Вводится местно в зону травмы.
  components:
  - type: SolutionContainerManager
    solutions:
      injector:
        maxVol: 15
        reagents:
        - ReagentId: Tranexam
          Quantity: 15

- type: entity
  parent: BaseSessionLimbSyringe
  id: SessionSyringeDextropin
  name: шприц декстропина
  description: 15 мг декстропина. Полипотентный регенератор экспериментального ряда. Восстанавливает урон любого происхождения (включая токсины и облучение) по 3 ед. в секунду до 60 HP конечности. Применяется местно. Хранить вдали от прямого света.
  components:
  - type: SolutionContainerManager
    solutions:
      injector:
        maxVol: 15
        reagents:
        - ReagentId: Dextropin
          Quantity: 15

- type: entity
  parent: BaseItem
  id: SessionMedicalNeedle
  name: медицинская нить
  description: Одноразовая. Первый этап хирургии выбитой конечности. После - тактические ножницы.
  components:
  - type: Sprite
    sprite: _Session/Objects/Medical/igla.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: LimbSurgeryTool
    stage: Needle

- type: entity
  parent: BaseItem
  id: SessionTacticalScissors
  name: тактические ножницы
  description: Завершают хирургию выбитой конечности после мед. нити, восстанавливая её.
  components:
  - type: Sprite
    sprite: _Session/Objects/Medical/tactical_scissors.rsi
    state: icon
  - type: Item
  - type: LimbSurgeryTool
    stage: Scissors

- type: entity
  parent: BaseItem
  id: SessionBandage
  name: бинт
  description: Останавливает лёгкое кровотечение на любой конечности и частично восполняет кровопотерю. Два применения.
  components:
  - type: Sprite
    sprite: _Session/Objects/Medical/bint.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: LimbBleedCure
    curesHeavy: false
    armsLegsOnly: false
    healBloodloss: 10
  - type: LimitedCharges
    maxCharges: 2

- type: entity
  parent: BaseItem
  id: SessionEsmarchTourniquet
  name: жгут Эсмарха
  description: Останавливает любое кровотечение, но только на руке или ноге. Одноразовый.
  components:
  - type: Sprite
    sprite: _Session/Objects/Medical/esmarch_tourniquet.rsi
    state: icon
  - type: Item
  - type: LimbBleedCure
    curesHeavy: true
    curesLight: true
    armsLegsOnly: true
    healBloodloss: 25
  - type: LimitedCharges
    maxCharges: 1

- type: entity
  parent: BaseItem
  id: SessionCalok
  name: CALOK
  description: Кровоостанавливающий гель-аппликатор. Закрывает кровотечение любой силы на любой конечности. Одноразовый.
  components:
  - type: Sprite
    sprite: _Session/Objects/Medical/calok.rsi
    layers:
    - state: icon
      map: ["base"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.SyringeVisuals.Spent:
        base:
          True: { state: used }
          False: { state: icon }
  - type: Item
    size: Tiny
  - type: LimbBleedCure
    curesHeavy: true
    curesLight: true
    armsLegsOnly: false
    healBloodloss: 40

- type: entity
  parent: BaseStorageItem
  id: SessionMedkitAI2
  name: аптечка АИ-2
  description: Гражданская аптечка. Три шприца кеторолака.
  components:
  - type: Sprite
