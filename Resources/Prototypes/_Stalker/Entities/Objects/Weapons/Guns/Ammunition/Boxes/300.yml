- type: entity
  parent: BaseAmmoBoxStalker
  id: 300FMJBox
  name: Коробка патронов (.300) БПЗ FMJ
  description: Для некоторых некоторых редких автоматов в коробке 30 штук. Обеспечивает пробитие 3 класса брони.
  suffix: Stalker
  components:
  - type: MagazineVisuals
    magState: 300ammo
  - type: BallisticAmmoProvider
    capacity: 30
    proto: STCartridge300FMJ
    whitelist:
      tags:
        - STCartridge300
  - type: Sprite
    layers:
    - state: 300BPZ_FMJ
      map: ["enum.GunVisualLayers.Base"]
    - state: 300ammo-1
      map: ["enum.GunVisualLayers.Mag"]

