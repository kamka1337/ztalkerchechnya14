- type: entity
  abstract: true
  parent: STBaseWeaponRifle
  id: STBaseWeaponRifleAKM
  components:
  - type: STWeight
    self: 3.5
  - type: PullDoAfter
    pullTime: 3.5
  - type: GunWieldBonus
    minAngle: -53
    maxAngle: -55
  - type: Clothing
    sprite: _Stalker/Objects/Weapons/Guns/Rifles/akm.rsi
  - type: Item
    sprite: _Stalker/Objects/Weapons/Guns/Rifles/akm.rsi
  - type: Sprite
    sprite: _Stalker/Objects/Weapons/Guns/Rifles/akm.rsi
  - type: Gun
    soundGunshot:
      path: /Audio/_Stalker/Effects/Guns/103_shoot.ogg
    minAngle: 55
    maxAngle: 105
    fireRate: 6
    angleIncrease: 1.6
    angleDecay: 7
    projectileSpeed: 60
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - FullAuto
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Base739Mag10
        insertSound: /Audio/_Stalker/Weapons/Guns/RifleGen/MagIn/rifle_magin.ogg
        ejectSound: /Audio/_Stalker/Weapons/Guns/RifleGen/MagOut/rifle_magout.ogg
        priority: 4
        whitelist:
          tags:
          - Magazine739
      gun_module_muzzle:
        name: Muzzle
        priority: 3
        whitelist:
          tags:
          - STWeaponModuleRifleSilencerRu
      gun_module_scope:
        name: Scope
        priority: 2
        whitelist:
          tags:
          - STWeaponModuleRifleScopeRu
      gun_chamber:
        name: Chamber
        startingItem:
        priority: 1
        whitelist:
          tags:
          - STCartridge739
  - type: STWeaponDamageFalloff
    falloffMultiplier: 0.8
  - type: STWeaponAccuracy
    accuracyMultiplier: 1.55
  - type: STGunshotSmoke # Zona14: Gunshot smoke cloud effect
    effectProto: STEffectGunshotSmokeAKM
    secondaryEffectProto: STEffectGunshotSmokeWisp
    muzzleOffset: 0.62
    secondaryOffset: 0.46

