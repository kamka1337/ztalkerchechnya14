- type: soundCollection
  id: ChechnyaAmbientSound
  files:
    - /Audio/_Chechnya/Ambient/field_night_crickets.ogg
    - /Audio/_Chechnya/Ambient/forest_trees_sway.ogg
    - /Audio/_Chechnya/Ambient/mountain_antenna_wind.ogg
    - /Audio/_Chechnya/Ambient/mountain_border_sign_wind.ogg
    - /Audio/_Chechnya/Ambient/mountain_night_wind.ogg
    - /Audio/_Chechnya/Ambient/mountain_pine_wind.ogg
    - /Audio/_Chechnya/Ambient/mountain_ridge_wind.ogg
    - /Audio/_Chechnya/Ambient/mountain_stone_wind.ogg

# Kept for FloorRitualChasmEntity (ritualchasm.yml); not used for ambientMusic.
- type: soundCollection
  id: StalkerHorrorSound
  files:
    - /Audio/_Stalker/Ambient/rnd_horror.ogg
    - /Audio/_Stalker/Ambient/rnd_horror1.ogg
    - /Audio/_Stalker/Ambient/rnd_krik1.ogg
    - /Audio/_Stalker/Ambient/rnd_krik2.ogg
    - /Audio/_Stalker/Ambient/rnd_krik3.ogg
    - /Audio/_Stalker/Ambient/rnd_krik4.ogg
    - /Audio/_Stalker/Ambient/rnd_krik5.ogg
    - /Audio/_Stalker/Ambient/rnd_krik7.ogg

- type: ambientMusic
  id: ChechnyaAmbient
  sound:
    params:
      volume: -14
    collection: ChechnyaAmbientSound
  rules: OnMapGrid
  fadeIn: true
  interruptable: true
  priority: 3

- type: rules
  id: OnMapGrid
  rules:
    - !type:OnMapGridRule

## Fallback if nothing else found
- type: ambientMusic
  id: ChechnyaFallbackAmbient
  sound:
    params:
      volume: -14
    collection: ChechnyaAmbientSound
  rules: AlwaysTrue
  fadeIn: true

- type: rules
  id: AlwaysTrue
  rules:
    - !type:AlwaysTrueRule
